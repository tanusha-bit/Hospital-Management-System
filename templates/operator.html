<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Portal - Hospital Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #3b82f6;
            --accent-warning: #f59e0b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg-color), #020617);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            z-index: 1;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dashboard-container {
            display: flex;
            gap: 2rem;
            z-index: 1;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            width: 250px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .appointment .card-icon { color: var(--accent-warning); }

        .card-title {
            font-size: 1.5rem;
            margin: 0;
            font-weight: 600;
        }

        .back-btn {
            margin-top: 3rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s;
            z-index: 1;
        }

        .back-btn:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Operator Portal</h1>
    </div>

    <div class="dashboard-container">
        <a href="/patient" class="card appointment">
            <div class="card-icon">
                <i class="fa-solid fa-bed-pulse"></i>
            </div>
            <h2 class="card-title">Patient Records</h2>
        </a>
        <a href="/appointment" class="card appointment">
            <div class="card-icon">
                <i class="fa-solid fa-calendar-check"></i>
            </div>
            <h2 class="card-title">Manage Appointments</h2>
        </a>
        <a href="/doctor" class="card appointment">
            <div class="card-icon">
                <i class="fa-solid fa-user-doctor"></i>
            </div>
            <h2 class="card-title">Doctor Records</h2>
        </a>
        <a href="/nurse" class="card appointment">
            <div class="card-icon">
                <i class="fa-solid fa-briefcase-medical"></i>
            </div>
            <h2 class="card-title">Nurse Records</h2>
        </a>
        <a href="/pharmacist" class="card appointment">
            <div class="card-icon">
                <i class="fa-solid fa-pills"></i>
            </div>
            <h2 class="card-title">Pharmacist Records</h2>
        </a>
        <a href="/billing" class="card appointment">
            <div class="card-icon">
                <i class="fa-solid fa-file-invoice"></i>
            </div>
            <h2 class="card-title">Billing</h2>
        </a>
        <a href="/admin/accounts" class="card appointment">
            <div class="card-icon">
                <i class="fa-solid fa-user-lock"></i>
            </div>
            <h2 class="card-title">Accounts & Assignments</h2>
        </a>
    </div>

    <form action="/logout" method="POST">
        <button type="submit" class="back-btn" style="background:none;border:0;cursor:pointer;font:inherit;">
            <i class="fa-solid fa-right-from-bracket"></i> Sign Out
        </button>
    </form>
</body>
</html>
