<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nurse Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255,255,255,0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-nurse: #38bdf8;
        }
        body { margin:0; padding:2rem; font-family:'Outfit',sans-serif; background:var(--bg-color); color:var(--text-main); min-height:100vh; }
        .header h1 { font-size:2.5rem; margin:0 0 2rem; background:linear-gradient(135deg, #bae6fd, #38bdf8); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
        .container { display:flex; gap:2rem; flex-wrap:wrap; }
        .form-section, .list-section { background:var(--card-bg); border:1px solid var(--card-border); border-radius:12px; padding:2rem; flex:1; min-width:300px; }
        .form-group { margin-bottom:1rem; }
        .form-group label { display:block; margin-bottom:0.5rem; color:var(--text-muted); }
        .form-group input { width:100%; padding:0.8rem; border-radius:8px; border:1px solid var(--card-border); background:rgba(15, 23, 42, 0.6); color:var(--text-main); box-sizing:border-box; }
        .action-btn { background:var(--accent-nurse); color:#082f49; border:none; padding:0.8rem 1.5rem; border-radius:8px; font-weight:700; cursor:pointer; width:100%; margin-top:1rem; }
        .doc-card { background:rgba(255,255,255,0.05); padding:1rem; border-radius:8px; margin-bottom:1rem; border-left:4px solid var(--accent-nurse); }
        .back-link { display:inline-block; margin-bottom:1rem; color:var(--text-muted); text-decoration:none; }
        .login-box { border:1px dashed var(--accent-nurse); padding:1.5rem; border-radius:12px; margin-bottom:2rem; background:rgba(56, 189, 248, 0.05); }
    </style>
</head>
<body>
    <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
    <div class="header">
        <h1>Nurse Portal</h1>
    </div>

    <div class="container">
        <div class="form-section">
            <div class="login-box">
                <h3>Individual nurse access</h3>
                <p>Assign a private username and password from Admin Accounts.</p>
                <a href="/admin/accounts">Manage stakeholder logins</a>
            </div>

            <h3>Register New Nurse</h3>
            <form action="/add_nurse" method="POST">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Specialization</label>
                    <input type="text" name="spec" required>
                </div>
                <div class="form-group">
                    <label>Contact No</label>
                    <input type="text" name="contact" required>
                </div>
                <button type="submit" class="action-btn">Add Nurse</button>
            </form>
        </div>

        <div class="list-section">
            <h3>Nurses</h3>
            {% for n in nurses %}
            <div class="doc-card">
                <strong>ID:</strong> {{ n[0] }} <br>
                <strong>{{ n[1] }}</strong> <br>
                <span style="color: var(--text-muted);">{{ n[2] }}</span>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
