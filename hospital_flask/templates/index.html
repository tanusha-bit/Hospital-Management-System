<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #3b82f6;
            --accent-secondary: #ec4899;
            --accent-tertiary: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg-color), #020617);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: -100px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .header {
            text-align: center;
            margin-bottom: 4rem;
            z-index: 1;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(96, 165, 250, 0.2);
            letter-spacing: -1px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-top: 0.5rem;
            font-weight: 300;
        }

        .dashboard-container {
            display: flex;
            gap: 2rem;
            z-index: 1;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 2rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem 2rem;
            width: 280px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
            z-index: 1;
        }

        .card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-icon {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 2;
            transition: transform 0.3s ease;
        }
        
        .card:hover .card-icon {
            transform: scale(1.1);
        }

        .patient .card-icon { color: var(--accent-tertiary); text-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
        .operator .card-icon { color: var(--accent-primary); text-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        .doctor .card-icon { color: var(--accent-secondary); text-shadow: 0 0 20px rgba(236, 72, 153, 0.4); }

        .card-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
            position: relative;
            z-index: 2;
            letter-spacing: 0.5px;
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 0.8rem;
            position: relative;
            z-index: 2;
            font-weight: 300;
        }

        /* Hover glows */
        .card::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 10px;
            bottom: 0;
            left: 0;
            transition: all 0.3s ease;
        }
        .card.patient::after { background: var(--accent-tertiary); opacity: 0.5; }
        .card.operator::after { background: var(--accent-primary); opacity: 0.5; }
        .card.doctor::after { background: var(--accent-secondary); opacity: 0.5; }

        .card:hover::after {
            height: 100%;
            opacity: 0.05;
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="header">
        <h1>Lifeline Hospital Hub</h1>
        <p>Select your portal to proceed</p>
    </div>

    <div class="dashboard-container">
        <a href="/patient" class="card patient">
            <div class="card-icon">
                <i class="fa-solid fa-bed-pulse"></i>
            </div>
            <h2 class="card-title">Patient</h2>
            <div class="card-subtitle">Manage patient records, admission & details</div>
        </a>

        <a href="/operator" class="card operator">
            <div class="card-icon">
                <i class="fa-solid fa-desktop"></i>
            </div>
            <h2 class="card-title">Operator</h2>
            <div class="card-subtitle">Handle appointments, billing & front-desk</div>
        </a>

        <a href="/doctor" class="card doctor">
            <div class="card-icon">
                <i class="fa-solid fa-user-doctor"></i>
            </div>
            <h2 class="card-title">Doctor</h2>
            <div class="card-subtitle">View staff profiles, specializations & info</div>
        </a>
    </div>
</body>
</html>
